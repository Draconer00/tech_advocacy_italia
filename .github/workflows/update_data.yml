name: Radar Advocacy - Automazione Dati

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Le action JS (checkout, setup-python, upload/download-artifact, cache) girano
# ancora su Node 20, deprecato: GitHub forza Node 24 di default dal 16/06/2026.
# Anticipiamo qui la migrazione — è l'opt-in documentato e silenzia gli avvisi.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ==============================================
  # SCRAPER GPDP (solo raccolta, no commit)
  # ==============================================
  scraper-gpdp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Scraping Garante Privacy
        run: python scrapers/scraper_gpdp.py
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-gpdp-data
          path: data/raw/gpdp*.csv
          retention-days: 1

  # ==============================================
  # SCRAPER ONG (solo raccolta, no commit)
  # ==============================================
  scraper-ong:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Scraping ONG RSS
        run: python scrapers/scraper_ong.py
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-ong-data
          path: data/raw/ong*.csv
          retention-days: 1

  # ==============================================
  # SCRAPER GNEWS (solo raccolta, no commit)
  # Richiede secret GNEWS_API_KEY nel repository.
  # ==============================================
  scraper-gnews:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Scraping GNews
        run: python scrapers/scraper_gnews.py
        continue-on-error: true
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-gnews-data
          path: data/raw/gnews*.csv
          retention-days: 1
          if-no-files-found: ignore

  # ==============================================
  # SCRAPER RSS EUROPEO (solo raccolta, no commit)
  # ==============================================
  scraper-rss-eu:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Scraping RSS Regolatori Europei
        run: python scrapers/scraper_rss_eu.py
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-rss-eu-data
          path: data/raw/rss_eu*.csv
          retention-days: 1
          if-no-files-found: ignore

  # ==============================================
  # SCRAPER AGCOM (solo raccolta, no commit)
  # ==============================================
  scraper-agcom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Scraping AGCOM
        run: python scrapers/scraper_agcom.py
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-agcom-data
          path: data/raw/agcom*.csv
          retention-days: 1
          if-no-files-found: ignore

  # ==============================================
  # SCRAPER TECH NEWS ITALIANE (solo raccolta, no commit)
  # ==============================================
  scraper-tech-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Scraping Tech News Italia
        run: python scrapers/scraper_tech_news.py
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-tech-news-data
          path: data/raw/tech_news*.csv
          retention-days: 1
          if-no-files-found: ignore

  # ==============================================
  # SCRAPER PARLAMENTO EUROPEO (solo raccolta, no commit)
  # ==============================================
  scraper-eu-parl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Scraping Parlamento Europeo (RSS + Open Data API)
        run: python scrapers/scraper_eu_parl.py
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-eu-parl-data
          path: data/raw/eu_parl*.csv
          retention-days: 1
          if-no-files-found: ignore

  # ==============================================
  # ANALISI NLP & SALVATAGGIO FINALE
  # Dipende da tutti e 7 gli scraper.
  # continue-on-error sui job scraper garantisce che
  # questo step parta comunque anche se uno scraper fallisce.
  # ==============================================
  analisi-nlp:
    needs: [scraper-gpdp, scraper-ong, scraper-gnews, scraper-rss-eu,
            scraper-agcom, scraper-tech-news, scraper-eu-parl]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache modelli AI (HuggingFace)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-models-

      - run: |
          pip install -r requirements.txt
          python -m spacy download it_core_news_md

      # Tutti i download sono tolleranti ai fallimenti: se uno scraper non ha
      # prodotto il proprio artifact, l'analisi NLP procede comunque sulle
      # fonti disponibili (text_analysis.py salta le sorgenti mancanti).
      - name: Scarica dati GPDP
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw-gpdp-data
          path: data/raw/

      - name: Scarica dati ONG
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw-ong-data
          path: data/raw/

      - name: Scarica dati GNews
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw-gnews-data
          path: data/raw/

      - name: Scarica dati RSS EU
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw-rss-eu-data
          path: data/raw/

      - name: Scarica dati AGCOM
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw-agcom-data
          path: data/raw/

      - name: Scarica dati Tech News Italia
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw-tech-news-data
          path: data/raw/

      - name: Scarica dati Parlamento Europeo
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw-eu-parl-data
          path: data/raw/

      - name: Analisi NLP
        run: python nlp/text_analysis.py

      # I dati non vengono versionati nel repo (design del paper: data not in repo).
      # Il run produce output scaricabile come artifact invece di committarlo.
      - name: Upload dati processati (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: |
            data/processed/*.csv
            data/*.db
          retention-days: 7
          if-no-files-found: ignore
